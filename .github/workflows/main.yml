name: Compilar APK con Buildozer Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar APK usando Docker oficial de Kivy
        uses: kivy/buildozer-action@master
        with:
          command: android debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
